{% extends 'users/userbase.html' %}

{% block content %}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Disease Prediction</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="symptom_1">Symptom 1:</label>
            <input type="text" name="symptom_1"  required>

            <label for="symptom_2">Symptom 2:</label>
            <input type="text" name="symptom_2" >

            <label for="symptom_3">Symptom 3:</label>
            <input type="text" name="symptom_3" >

            <label for="symptom_4">Symptom 4:</label>
            <input type="text" name="symptom_4" >

            <label for="symptom_5">Symptom 5:</label>
            <input type="text" name="symptom_5" >

            <label for="symptom_6">Symptom 6:</label>
            <input type="text" name="symptom_6" >

            <label for="symptom_7">Symptom 7:</label>
            <input type="text" name="symptom_7" >

            <button type="submit">Predict Disease</button>
        </form>

        {% if predicted_disease %}
        <div class="result">
            <strong>Predicted Disease:</strong> {{ predicted_disease }}
        </div>
        {% endif %}
    </div>

</body>

{% endblock %}
